# Render Blueprint: backend Django (paket gratis). Frontend di Vercel/Cloudflare Pages (lihat DEPLOY.md).
services:
  - type: web
    name: next-pos-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Paket gratis tidak punya pre-deploy command, jadi migrasi dijalankan saat start (aman: 1 instance).
    startCommand: python manage.py migrate --noinput && gunicorn nextpos.wsgi:application --config gunicorn.conf.py
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Isi manual di dashboard Render (sync: false = tidak disimpan di repo):
      - key: CORS_ALLOWED_ORIGINS      # https://<app>.vercel.app
        sync: false
      - key: FRONTEND_BASE_URL         # https://<app>.vercel.app
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT                   # TiDB Cloud: 4000, MySQL biasa: 3306
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "1"
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
